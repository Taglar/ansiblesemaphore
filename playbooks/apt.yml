---
- name: APT Update & Upgrade mit Backup und Logging
  hosts: LinuxUbuntu
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:
    backup_root: "/var/backups"
    apt_lock_timeout: 300
    apt_cache_valid_time: 3600

  pre_tasks:
    # ------------------------------------------------------------
    # Einmaligen globalen Zeitstempel erzeugen
    # ------------------------------------------------------------
    - name: Generiere globalen Zeitstempel
      run_once: true
      delegate_to: localhost
      vars:
        ts_command: "date +%Y-%m-%d_%H%M%S"
      ansible.builtin.set_fact:
        generated_backup_date: "{{ lookup('pipe', ts_command) }}"

    - name: Globalen Zeitstempel an alle Hosts weitergeben
      run_once: true
      ansible.builtin.add_host:
        name: "global_vars_holder"
        backup_date: "{{ generated_backup_date }}"

    - name: Hole globalen Zeitstempel aus global_vars_holder
      ansible.builtin.set_fact:
        backup_date: "{{ hostvars['global_vars_holder'].backup_date }}"
        backup_dir: "{{ backup_root }}/apt_config_{{ hostvars['global_vars_holder'].backup_date }}"
        diff_log: "{{ backup_root }}/apt_config_{{ hostvars['global_vars_holder'].backup_date }}/apt_diff.log"
        new_files_log: "{{ backup_root }}/apt_config_{{ hostvars['global_vars_holder'].backup_date }}/new_config_files.log"

  tasks:

    # ============================================================
    # Backup-Verzeichnisse
    # ============================================================

    - name: Stelle korrektes /var/backups Verzeichnis sicher
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Backup-Verzeichnis für diesen Lauf anlegen
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'


    # ============================================================
    # APT Paketquellen aktualisieren
    #
    # lock_timeout:
    #   Wartet bis zu 300 Sekunden auf einen belegten APT/dpkg-Lock.
    #
    # cache_valid_time:
    #   apt update wird nur ausgeführt, wenn der Cache älter
    #   als 3600 Sekunden ist.
    #
    # retries:
    #   Falls APT trotz lock_timeout fehlschlägt, erfolgt
    #   ein weiterer Versuch.
    # ============================================================

    - name: Paketquellen aktualisieren
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"
        lock_timeout: "{{ apt_lock_timeout }}"
      register: update_result
      retries: 2
      delay: 15
      until: update_result is succeeded


    # ============================================================
    # Kernelstand VOR dem Upgrade erfassen
    # ============================================================

    - name: Ermittle neuesten installierten Kernel vor dem Upgrade
      ansible.builtin.shell: |
        set -o pipefail
        ls -1 /boot/vmlinuz-* 2>/dev/null \
          | sort -V \
          | tail -n 1 \
          | sed 's#.*/vmlinuz-##' || true
      args:
        executable: /bin/bash
      register: kernel_before
      changed_when: false
      failed_when: false


    # ============================================================
    # APT Upgrade
    # ============================================================

    - name: Installierte Pakete aktualisieren
      ansible.builtin.apt:
        upgrade: dist
        lock_timeout: "{{ apt_lock_timeout }}"
      register: upgrade_result
      retries: 2
      delay: 15
      until: upgrade_result is succeeded


    # ============================================================
    # APT Bereinigung getrennt vom Upgrade
    # ============================================================

    - name: Nicht mehr benötigte Pakete entfernen und Cache bereinigen
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
        lock_timeout: "{{ apt_lock_timeout }}"
      register: cleanup_result
      retries: 2
      delay: 15
      until: cleanup_result is succeeded


    # ============================================================
    # Kernelstand NACH dem Upgrade erfassen
    # ============================================================

    - name: Ermittle neuesten installierten Kernel nach dem Upgrade
      ansible.builtin.shell: |
        set -o pipefail
        ls -1 /boot/vmlinuz-* 2>/dev/null \
          | sort -V \
          | tail -n 1 \
          | sed 's#.*/vmlinuz-##' || true
      args:
        executable: /bin/bash
      register: kernel_after
      changed_when: false
      failed_when: false

    - name: Ermittle aktuell laufenden Kernel
      ansible.builtin.command:
        cmd: uname -r
      register: running_kernel
      changed_when: false


    # ============================================================
    # Reboot-Check
    # ============================================================

    - name: Prüfe ob Neustart erforderlich ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_check

    - name: Setze Kernel- und Reboot-Status
      ansible.builtin.set_fact:
        kernel_updated_during_run: >-
          {{
            kernel_before.stdout | trim != kernel_after.stdout | trim
            and kernel_after.stdout | trim != ''
          }}

        running_kernel_outdated: >-
          {{
            kernel_after.stdout | trim != ''
            and running_kernel.stdout | trim != kernel_after.stdout | trim
          }}

        reboot_required: >-
          {{
            reboot_check.stat.exists | default(false)
          }}


    # ============================================================
    # Neue/geänderte Paket-Konfigurationsdateien suchen
    #
    # dpkg-dist = neue Konfiguration des Paketbetreuers
    # dpkg-old  = vorherige Konfiguration
    # dpkg-new  = temporäre/neue Konfiguration
    # ucf-dist  = neue Konfiguration bei UCF
    # ucf-old   = vorherige UCF-Konfiguration
    # ============================================================

    - name: Suche nach neuen oder geänderten Konfigurationsdateien
      ansible.builtin.find:
        paths: /etc
        recurse: true
        file_type: file
        patterns:
          - "*.dpkg-dist"
          - "*.dpkg-old"
          - "*.dpkg-new"
          - "*.ucf-dist"
          - "*.ucf-old"
      register: new_config_files


    # ============================================================
    # Log der gefundenen Konfigurationsdateien schreiben
    # ============================================================

    - name: Schreibe Liste der gefundenen Konfigurationsdateien
      ansible.builtin.copy:
        dest: "{{ new_files_log }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          === Neue / geänderte Paket-Konfigurationsdateien ===
          Host: {{ inventory_hostname }}
          Systemname: {{ ansible_hostname }}
          Datum: {{ ansible_date_time.iso8601 }}
          Anzahl: {{ new_config_files.matched }}
          ====================================================

          {% if new_config_files.matched | int > 0 %}
          {% for config_file in new_config_files.files %}
          {{ config_file.path }}
          {% endfor %}
          {% else %}
          Keine neuen oder geänderten Paket-Konfigurationsdateien gefunden.
          {% endif %}


    # ============================================================
    # Verzeichnisstruktur der gefundenen Dateien im Backup
    # erhalten
    #
    # Beispiel:
    #
    # /etc/nginx/nginx.conf.dpkg-dist
    #
    # wird zu:
    #
    # /var/backups/apt_config_DATE/
    #   artifacts/etc/nginx/nginx.conf.dpkg-dist
    # ============================================================

    - name: Erzeuge Verzeichnisstruktur für Paket-Konfigurationsdateien
      ansible.builtin.file:
        path: "{{ backup_dir }}/artifacts{{ item.path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ new_config_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: new_config_files.matched | int > 0

    - name: Sichere neue oder geänderte Paket-Konfigurationsdateien
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ backup_dir }}/artifacts{{ item.path }}"
        remote_src: true
        mode: preserve
      loop: "{{ new_config_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: new_config_files.matched | int > 0


    # ============================================================
    # Prüfen, ob zu den Paketdateien Originaldateien existieren
    # ============================================================

    - name: Prüfe ob Originaldateien existieren
      ansible.builtin.stat:
        path: "{{ original_path }}"
      vars:
        original_path: >-
          {{
            item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ new_config_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: original_files
      when: new_config_files.matched | int > 0


    # ============================================================
    # Originaldateien mit kompletter Pfadstruktur sichern
    #
    # Beispiel:
    #
    # /etc/nginx/nginx.conf
    #
    # wird zu:
    #
    # /var/backups/apt_config_DATE/
    #   originals/etc/nginx/nginx.conf
    # ============================================================

    - name: Erzeuge Verzeichnisstruktur für Originaldateien
      ansible.builtin.file:
        path: "{{ backup_dir }}/originals{{ original_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      vars:
        original_path: >-
          {{
            item.item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ original_files.results | default([]) }}"
      loop_control:
        label: "{{ original_path }}"
      when:
        - item.stat is defined
        - item.stat.exists | default(false)

    - name: Sichere vorhandene Originaldateien
      ansible.builtin.copy:
        src: "{{ original_path }}"
        dest: "{{ backup_dir }}/originals{{ original_path }}"
        remote_src: true
        mode: preserve
      vars:
        original_path: >-
          {{
            item.item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ original_files.results | default([]) }}"
      loop_control:
        label: "{{ original_path }}"
      when:
        - item.stat is defined
        - item.stat.exists | default(false)


    # ============================================================
    # Diff-Log initialisieren
    # ============================================================

    - name: Initialisiere Diff-Log
      ansible.builtin.copy:
        dest: "{{ diff_log }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          === APT Konfigurationsänderungen ===
          Host: {{ inventory_hostname }}
          Systemname: {{ ansible_hostname }}
          Datum: {{ ansible_date_time.iso8601 }}
          ====================================


    # ============================================================
    # Diffs zwischen Original und Paketdatei erzeugen
    #
    # diff gibt Exitcode 1 zurück, wenn Unterschiede vorhanden
    # sind. Das ist kein Fehler und wird deshalb abgefangen.
    # ============================================================

    - name: Erzeuge Diff für gefundene Konfigurationsdateien
      ansible.builtin.shell: |
        {
          echo
          echo "============================================================"
          echo "Datei: {{ item.item.path }}"
          echo "Original: {{ original_path }}"
          echo "============================================================"

          if [ -f {{ original_path | quote }} ]; then
              diff -u \
                --label {{ original_path | quote }} \
                --label {{ item.item.path | quote }} \
                {{ original_path | quote }} \
                {{ item.item.path | quote }} || true
          else
              echo "Originaldatei nicht vorhanden."
          fi
        } >> {{ diff_log | quote }}
      args:
        executable: /bin/bash
      vars:
        original_path: >-
          {{
            item.item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ original_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path }}"
      changed_when: false
      when:
        - item.item is defined


    # ============================================================
    # Zusammenfassung
    # ============================================================

    - name: Zusammenfassung anzeigen
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "APT UPDATE / UPGRADE ABGESCHLOSSEN"
          - "============================================================"

          - >-
            {{
              '🔄 APT-Paketcache wurde aktualisiert'
              if update_result.changed
              else
              '✅ APT-Paketcache war noch aktuell'
            }}

          - >-
            {{
              '📦 Pakete wurden aktualisiert'
              if upgrade_result.changed
              else
              '✅ Keine Paketupdates erforderlich'
            }}

          - >-
            {{
              '🧹 Nicht mehr benötigte Pakete wurden entfernt / Cache bereinigt'
              if cleanup_result.changed
              else
              '✅ Keine APT-Bereinigung erforderlich'
            }}

          - "📁 Backup-Verzeichnis: {{ backup_dir }}"
          - "📄 Konfigurationsdateien gefunden: {{ new_config_files.matched }}"
          - "📝 Dateiliste: {{ new_files_log }}"
          - "🔍 Diff-Log: {{ diff_log }}"

          - >-
            {{
              '🧩 Während dieses Laufs wurde ein neuer Kernel installiert'
              if kernel_updated_during_run
              else
              '✅ Während dieses Laufs wurde kein neuer Kernel installiert'
            }}

          - >-
            {{
              '⚠️ Laufender Kernel ' ~ running_kernel.stdout ~
              ' entspricht nicht dem neuesten installierten Kernel ' ~
              kernel_after.stdout
              if running_kernel_outdated
              else
              '✅ Laufender Kernel ist aktuell'
            }}

          - >-
            {{
              '♻️ Neustart erforderlich'
              if reboot_required
              else
              '✅ Kein Neustart erforderlich'
            }}

          - "🚀 APT Update & Upgrade auf {{ inventory_hostname }} abgeschlossen"
