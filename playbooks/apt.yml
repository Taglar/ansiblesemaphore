---
- name: APT Update & Upgrade mit Backup und Logging
  hosts: LinuxUbuntu
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:
    backup_root: "/var/backups"

    # Maximale Wartezeit auf einen belegten APT/dpkg-Lock.
    # Bei dauerhaft blockiertem APT soll nicht 5 Minuten pro Versuch
    # gewartet werden.
    apt_lock_timeout: 60

    # apt update wird nur ausgeführt, wenn der Paketcache älter
    # als eine Stunde ist.
    apt_cache_valid_time: 3600


  pre_tasks:

    # ============================================================
    # Einmaligen globalen Zeitstempel erzeugen
    # ============================================================

    - name: Generiere globalen Zeitstempel
      run_once: true
      delegate_to: localhost
      vars:
        ts_command: "date +%Y-%m-%d_%H%M%S"
      ansible.builtin.set_fact:
        generated_backup_date: "{{ lookup('pipe', ts_command) }}"

    - name: Globalen Zeitstempel an alle Hosts weitergeben
      run_once: true
      ansible.builtin.add_host:
        name: "global_vars_holder"
        backup_date: "{{ generated_backup_date }}"

    - name: Hole globalen Zeitstempel aus global_vars_holder
      ansible.builtin.set_fact:
        backup_date: "{{ hostvars['global_vars_holder'].backup_date }}"
        backup_dir: "{{ backup_root }}/apt_config_{{ hostvars['global_vars_holder'].backup_date }}"
        diff_log: "{{ backup_root }}/apt_config_{{ hostvars['global_vars_holder'].backup_date }}/apt_diff.log"
        new_files_log: "{{ backup_root }}/apt_config_{{ hostvars['global_vars_holder'].backup_date }}/new_config_files.log"


  tasks:

    # ============================================================
    # Backup-Verzeichnisse
    # ============================================================

    - name: Stelle korrektes /var/backups Verzeichnis sicher
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Backup-Verzeichnis für diesen Lauf anlegen
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'


    # ============================================================
    # APT / DPKG VORAB-DIAGNOSE
    #
    # Zeigt vor dem eigentlichen apt update:
    # - vorhandene Lock-Dateien
    # - Prozesse, die Locks halten
    # - laufende apt/dpkg/unattended Prozesse
    # - Status der systemd APT-Dienste
    # - Status der APT-Timer
    # ============================================================

    - name: Prüfe APT-Locks und laufende Paketprozesse
      ansible.builtin.shell: |
        echo "===== APT / DPKG LOCKS ====="

        for lock in \
          /var/lib/dpkg/lock \
          /var/lib/dpkg/lock-frontend \
          /var/lib/apt/lists/lock \
          /var/cache/apt/archives/lock
        do
          echo
          echo "--- $lock ---"

          if [ -e "$lock" ]; then
            fuser -v "$lock" 2>&1 || echo "Kein Prozess hält diesen Lock."
          else
            echo "Lock-Datei existiert nicht."
          fi
        done

        echo
        echo "===== LAUFENDE APT / DPKG PROZESSE ====="

        ps -eo pid,ppid,etime,state,wchan:30,cmd \
          | grep -E '[a]pt|[d]pkg|[u]nattended' \
          || echo "Keine laufenden APT/DPKG-Prozesse gefunden."

        echo
        echo "===== SYSTEMD APT SERVICES ====="

        systemctl --no-pager --full status \
          apt-daily.service \
          apt-daily-upgrade.service \
          unattended-upgrades.service \
          2>&1 || true

        echo
        echo "===== SYSTEMD APT TIMER ====="

        systemctl --no-pager --full list-timers \
          apt-daily.timer \
          apt-daily-upgrade.timer \
          2>&1 || true

      args:
        executable: /bin/bash
      register: apt_precheck
      changed_when: false
      failed_when: false

    - name: Zeige APT Status vor Update
      ansible.builtin.debug:
        msg: "{{ apt_precheck.stdout_lines }}"


    # ============================================================
    # APT Paketquellen aktualisieren
    #
    # Falls apt update fehlschlägt, läuft der Rescue-Block und
    # sammelt umfangreiche Diagnoseinformationen.
    # ============================================================

    - name: Paketquellen aktualisieren mit Fehlerdiagnose
      block:

        - name: Paketquellen aktualisieren
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: "{{ apt_cache_valid_time }}"
            lock_timeout: "{{ apt_lock_timeout }}"
          register: update_result
          retries: 2
          delay: 15
          until: update_result is succeeded


      rescue:

        # --------------------------------------------------------
        # Ergebnis des fehlgeschlagenen Ansible-APT-Tasks
        # --------------------------------------------------------

        - name: Debug - Ansible APT Fehler
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "❌ APT UPDATE FEHLGESCHLAGEN"
              - "============================================================"
              - "Host: {{ inventory_hostname }}"
              - "Message: {{ update_result.msg | default('Keine Meldung vorhanden') }}"
              - "STDOUT: {{ update_result.stdout | default('Keine STDOUT-Ausgabe vorhanden') }}"
              - "STDERR: {{ update_result.stderr | default('Keine STDERR-Ausgabe vorhanden') }}"
              - "RC: {{ update_result.rc | default('nicht vorhanden') }}"


        # --------------------------------------------------------
        # APT-Locks NACH dem Fehler prüfen
        # --------------------------------------------------------

        - name: Debug - Prüfe APT Locks nach Fehler
          ansible.builtin.shell: |
            echo "===== APT / DPKG LOCKS NACH FEHLER ====="

            for lock in \
              /var/lib/dpkg/lock \
              /var/lib/dpkg/lock-frontend \
              /var/lib/apt/lists/lock \
              /var/cache/apt/archives/lock
            do
              echo
              echo "--- $lock ---"

              if [ -e "$lock" ]; then
                fuser -v "$lock" 2>&1 || echo "Kein Prozess hält diesen Lock."
              else
                echo "Lock-Datei existiert nicht."
              fi
            done

            echo
            echo "===== LAUFENDE APT / DPKG PROZESSE ====="

            ps -eo pid,ppid,etime,state,wchan:30,cmd \
              | grep -E '[a]pt|[d]pkg|[u]nattended' \
              || echo "Keine laufenden APT/DPKG-Prozesse gefunden."

            echo
            echo "===== SYSTEMD APT SERVICES ====="

            systemctl --no-pager --full status \
              apt-daily.service \
              apt-daily-upgrade.service \
              unattended-upgrades.service \
              2>&1 || true

          args:
            executable: /bin/bash
          register: apt_lock_debug
          changed_when: false
          failed_when: false

        - name: Debug - Zeige Lock Informationen
          ansible.builtin.debug:
            msg: "{{ apt_lock_debug.stdout_lines }}"


        # --------------------------------------------------------
        # Logs von unattended-upgrades und APT ausgeben
        # --------------------------------------------------------

        - name: Debug - Letzte APT und unattended-upgrades Logs
          ansible.builtin.shell: |
            echo "===== UNATTENDED-UPGRADES LOG ====="

            if [ -f /var/log/unattended-upgrades/unattended-upgrades.log ]; then
              tail -n 50 /var/log/unattended-upgrades/unattended-upgrades.log
            else
              echo "Logdatei nicht vorhanden."
            fi

            echo
            echo "===== UNATTENDED-UPGRADES DPKG LOG ====="

            if [ -f /var/log/unattended-upgrades/unattended-upgrades-dpkg.log ]; then
              tail -n 50 /var/log/unattended-upgrades/unattended-upgrades-dpkg.log
            else
              echo "Logdatei nicht vorhanden."
            fi

            echo
            echo "===== APT TERM LOG ====="

            if [ -f /var/log/apt/term.log ]; then
              tail -n 50 /var/log/apt/term.log
            else
              echo "Logdatei nicht vorhanden."
            fi

            echo
            echo "===== APT HISTORY LOG ====="

            if [ -f /var/log/apt/history.log ]; then
              tail -n 50 /var/log/apt/history.log
            else
              echo "Logdatei nicht vorhanden."
            fi

          args:
            executable: /bin/bash
          register: apt_log_debug
          changed_when: false
          failed_when: false

        - name: Debug - Zeige APT Logs
          ansible.builtin.debug:
            msg: "{{ apt_log_debug.stdout_lines }}"


        # --------------------------------------------------------
        # Diagnostisches apt-get update
        #
        # Maximal 60 Sekunden Gesamtlaufzeit.
        #
        # Kein zusätzlicher Retry durch APT.
        # HTTP/HTTPS Timeout auf 15 Sekunden.
        # Lock-Wartezeit nur 10 Sekunden.
        #
        # Dadurch werden auch DNS-, IPv4/IPv6-, Repository-
        # oder Netzwerkprobleme sichtbar.
        # --------------------------------------------------------

        - name: Debug - Diagnostisches apt-get update
          ansible.builtin.shell: |
            timeout 60s \
              apt-get \
              -o DPkg::Lock::Timeout=10 \
              -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update 2>&1
          args:
            executable: /bin/bash
          register: apt_manual_debug
          changed_when: false
          failed_when: false

        - name: Debug - Zeige diagnostische apt-get Ausgabe
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "APT-GET UPDATE DEBUG"
              - "============================================================"
              - "Returncode: {{ apt_manual_debug.rc }}"
              - "{{ apt_manual_debug.stdout_lines }}"


        # --------------------------------------------------------
        # Host bewusst als fehlgeschlagen markieren.
        #
        # Es werden ausdrücklich KEINE Lock-Dateien gelöscht.
        # --------------------------------------------------------

        - name: APT Update endgültig als fehlgeschlagen markieren
          ansible.builtin.fail:
            msg: >-
              APT Update auf {{ inventory_hostname }} ist fehlgeschlagen.
              Die Diagnoseinformationen wurden unmittelbar davor ausgegeben.
              APT/dpkg-Lock-Dateien wurden aus Sicherheitsgründen nicht
              automatisch entfernt.


    # ============================================================
    # Kernelstand VOR dem Upgrade erfassen
    # ============================================================

    - name: Ermittle neuesten installierten Kernel vor dem Upgrade
      ansible.builtin.shell: |
        set -o pipefail

        ls -1 /boot/vmlinuz-* 2>/dev/null \
          | sort -V \
          | tail -n 1 \
          | sed 's#.*/vmlinuz-##' || true
      args:
        executable: /bin/bash
      register: kernel_before
      changed_when: false
      failed_when: false


    # ============================================================
    # APT Upgrade
    # ============================================================

    - name: Installierte Pakete aktualisieren
      ansible.builtin.apt:
        upgrade: dist
        lock_timeout: "{{ apt_lock_timeout }}"
      register: upgrade_result
      retries: 2
      delay: 15
      until: upgrade_result is succeeded


    # ============================================================
    # APT Bereinigung getrennt vom Upgrade
    # ============================================================

    - name: Nicht mehr benötigte Pakete entfernen und Cache bereinigen
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
        lock_timeout: "{{ apt_lock_timeout }}"
      register: cleanup_result
      retries: 2
      delay: 15
      until: cleanup_result is succeeded


    # ============================================================
    # Kernelstand NACH dem Upgrade erfassen
    # ============================================================

    - name: Ermittle neuesten installierten Kernel nach dem Upgrade
      ansible.builtin.shell: |
        set -o pipefail

        ls -1 /boot/vmlinuz-* 2>/dev/null \
          | sort -V \
          | tail -n 1 \
          | sed 's#.*/vmlinuz-##' || true
      args:
        executable: /bin/bash
      register: kernel_after
      changed_when: false
      failed_when: false

    - name: Ermittle aktuell laufenden Kernel
      ansible.builtin.command:
        cmd: uname -r
      register: running_kernel
      changed_when: false


    # ============================================================
    # Reboot-Check
    # ============================================================

    - name: Prüfe ob Neustart erforderlich ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_check

    - name: Setze Kernel- und Reboot-Status
      ansible.builtin.set_fact:

        kernel_updated_during_run: >-
          {{
            kernel_before.stdout | trim != kernel_after.stdout | trim
            and
            kernel_after.stdout | trim != ''
          }}

        running_kernel_outdated: >-
          {{
            kernel_after.stdout | trim != ''
            and
            running_kernel.stdout | trim != kernel_after.stdout | trim
          }}

        reboot_required: >-
          {{
            reboot_check.stat.exists | default(false)
          }}


    # ============================================================
    # Neue / geänderte Paket-Konfigurationsdateien suchen
    #
    # dpkg-dist = neue Paketversion einer Konfiguration
    # dpkg-old  = vorherige Konfiguration
    # dpkg-new  = neue / temporäre Paketkonfiguration
    # ucf-dist  = neue UCF-Konfiguration
    # ucf-old   = vorherige UCF-Konfiguration
    # ============================================================

    - name: Suche nach neuen oder geänderten Konfigurationsdateien
      ansible.builtin.find:
        paths: /etc
        recurse: true
        file_type: file
        patterns:
          - "*.dpkg-dist"
          - "*.dpkg-old"
          - "*.dpkg-new"
          - "*.ucf-dist"
          - "*.ucf-old"
      register: new_config_files


    # ============================================================
    # Liste der gefundenen Dateien schreiben
    # ============================================================

    - name: Schreibe Liste der gefundenen Konfigurationsdateien
      ansible.builtin.copy:
        dest: "{{ new_files_log }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          === Neue / geänderte Paket-Konfigurationsdateien ===
          Host: {{ inventory_hostname }}
          Systemname: {{ ansible_hostname }}
          Datum: {{ ansible_date_time.iso8601 }}
          Anzahl: {{ new_config_files.matched }}
          ====================================================

          {% if new_config_files.matched | int > 0 %}
          {% for config_file in new_config_files.files %}
          {{ config_file.path }}
          {% endfor %}
          {% else %}
          Keine neuen oder geänderten Paket-Konfigurationsdateien gefunden.
          {% endif %}


    # ============================================================
    # Paket-Konfigurationsdateien sichern
    #
    # Die komplette Verzeichnisstruktur wird erhalten.
    #
    # Beispiel:
    #
    # /etc/nginx/nginx.conf.dpkg-dist
    #
    # wird:
    #
    # /var/backups/apt_config_DATE/
    #   artifacts/etc/nginx/nginx.conf.dpkg-dist
    # ============================================================

    - name: Erzeuge Verzeichnisstruktur für Paket-Konfigurationsdateien
      ansible.builtin.file:
        path: "{{ backup_dir }}/artifacts{{ item.path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ new_config_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: new_config_files.matched | int > 0

    - name: Sichere neue oder geänderte Paket-Konfigurationsdateien
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ backup_dir }}/artifacts{{ item.path }}"
        remote_src: true
        mode: preserve
      loop: "{{ new_config_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: new_config_files.matched | int > 0


    # ============================================================
    # Zugehörige Originaldateien ermitteln
    # ============================================================

    - name: Prüfe ob Originaldateien existieren
      ansible.builtin.stat:
        path: "{{ original_path }}"
      vars:
        original_path: >-
          {{
            item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ new_config_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: original_files
      when: new_config_files.matched | int > 0


    # ============================================================
    # Originaldateien sichern
    #
    # Auch hier bleibt die komplette Pfadstruktur erhalten.
    #
    # Beispiel:
    #
    # /etc/nginx/nginx.conf
    #
    # wird:
    #
    # /var/backups/apt_config_DATE/
    #   originals/etc/nginx/nginx.conf
    # ============================================================

    - name: Erzeuge Verzeichnisstruktur für Originaldateien
      ansible.builtin.file:
        path: "{{ backup_dir }}/originals{{ original_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      vars:
        original_path: >-
          {{
            item.item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ original_files.results | default([]) }}"
      loop_control:
        label: "{{ original_path }}"
      when:
        - item.stat is defined
        - item.stat.exists | default(false)

    - name: Sichere vorhandene Originaldateien
      ansible.builtin.copy:
        src: "{{ original_path }}"
        dest: "{{ backup_dir }}/originals{{ original_path }}"
        remote_src: true
        mode: preserve
      vars:
        original_path: >-
          {{
            item.item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ original_files.results | default([]) }}"
      loop_control:
        label: "{{ original_path }}"
      when:
        - item.stat is defined
        - item.stat.exists | default(false)


    # ============================================================
    # Diff-Log initialisieren
    # ============================================================

    - name: Initialisiere Diff-Log
      ansible.builtin.copy:
        dest: "{{ diff_log }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          === APT Konfigurationsänderungen ===
          Host: {{ inventory_hostname }}
          Systemname: {{ ansible_hostname }}
          Datum: {{ ansible_date_time.iso8601 }}
          Anzahl gefundener Paketdateien: {{ new_config_files.matched }}
          ====================================


    # ============================================================
    # Diffs zwischen Original und Paketdatei erzeugen
    #
    # diff:
    # RC 0 = identisch
    # RC 1 = Unterschiede
    #
    # RC 1 ist daher kein Fehler.
    # ============================================================

    - name: Erzeuge Diff für gefundene Konfigurationsdateien
      ansible.builtin.shell: |
        {
          echo
          echo "============================================================"
          echo "Paketdatei: {{ item.item.path }}"
          echo "Original:   {{ original_path }}"
          echo "============================================================"

          if [ -f {{ original_path | quote }} ]; then

            diff -u \
              --label {{ original_path | quote }} \
              --label {{ item.item.path | quote }} \
              {{ original_path | quote }} \
              {{ item.item.path | quote }} || true

          else

            echo "Originaldatei nicht vorhanden."

          fi

        } >> {{ diff_log | quote }}
      args:
        executable: /bin/bash
      vars:
        original_path: >-
          {{
            item.item.path
            | regex_replace(
                '\.(dpkg-dist|dpkg-old|dpkg-new|ucf-dist|ucf-old)$',
                ''
              )
          }}
      loop: "{{ original_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path }}"
      changed_when: false
      when:
        - item.item is defined


    # ============================================================
    # Zusammenfassung
    # ============================================================

    - name: Zusammenfassung anzeigen
      ansible.builtin.debug:
        msg:

          - "============================================================"
          - "APT UPDATE / UPGRADE ABGESCHLOSSEN"
          - "============================================================"

          - >-
            {{
              '🔄 APT-Paketcache wurde aktualisiert'
              if update_result.changed
              else
              '✅ APT-Paketcache war noch aktuell'
            }}

          - >-
            {{
              '📦 Pakete wurden aktualisiert'
              if upgrade_result.changed
              else
              '✅ Keine Paketupdates erforderlich'
            }}

          - >-
            {{
              '🧹 Nicht mehr benötigte Pakete wurden entfernt / Cache bereinigt'
              if cleanup_result.changed
              else
              '✅ Keine APT-Bereinigung erforderlich'
            }}

          - "📁 Backup-Verzeichnis: {{ backup_dir }}"

          - "📄 Konfigurationsdateien gefunden: {{ new_config_files.matched }}"

          - "📝 Dateiliste: {{ new_files_log }}"

          - "🔍 Diff-Log: {{ diff_log }}"

          - >-
            {{
              '🧩 Während dieses Laufs wurde ein neuer Kernel installiert'
              if kernel_updated_during_run
              else
              '✅ Während dieses Laufs wurde kein neuer Kernel installiert'
            }}

          - >-
            {{
              '⚠️ Laufender Kernel ' ~ running_kernel.stdout ~
              ' entspricht nicht dem neuesten installierten Kernel ' ~
              kernel_after.stdout
              if running_kernel_outdated
              else
              '✅ Laufender Kernel ist aktuell'
            }}

          - >-
            {{
              '♻️ Neustart erforderlich'
              if reboot_required
              else
              '✅ Kein Neustart erforderlich'
            }}

          - "🚀 APT Update & Upgrade auf {{ inventory_hostname }} abgeschlossen"
